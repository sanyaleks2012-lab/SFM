<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Avatar Gallery</title>
    <style>
        :root {
            --bg-color: #f6f6f6;
            --card-bg: #ffffff;
            --border-color: #a2a9b1;
            --text-color: #202122;
            --code-bg: #f8f9fa;
            --accent-color: #36c;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: normal;
        }

        #search {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            width: 300px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: transform 0.1s ease;
        }

        .card:hover {
            border-color: var(--accent-color);
        }

        .img-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eaecf0;
            border: 1px dashed #ccc;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .code-line {
            background-color: var(--code-bg);
            border: 1px solid #e1e1e1;
            padding: 4px 6px;
            font-family: monospace;
            font-size: 11px;
            width: 90%;
            word-break: break-all;
            cursor: pointer;
            border-radius: 2px;
            position: relative;
            user-select: all;
        }

        .code-line:hover {
            background-color: #eaf3ff;
            border-color: var(--accent-color);
        }

        .code-line::after {
            content: "Клик — копировать";
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 2px;
            display: none;
            white-space: nowrap;
            z-index: 10;
        }

        .code-line:hover::after {
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2b2b2b;
            color: #fff;
            padding: 10px 16px;
            border-radius: 4px;
            display: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 13px;
        }
    </style>
</head>

        const gallery = document.getElementById('gallery');

        function renderGallery(files) {
            gallery.innerHTML = '';
            files.forEach(file => {
                // Извлечение имени без расширения для avatar="$"
                const iconName = file.replace(/\.[^/.]+$/, "");
                const avatarString = `avatar="${iconName}"`;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="Users/${file}" alt="${iconName}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'40\'><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23888\'>404</text></svg>'">
                    </div>
                    <div class="code-line" onclick="copyToClipboard('${avatarString}')">${avatarString}</div>
                `;
                gallery.appendChild(card);
            });
        }

        function filterGallery() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = rawFiles.filter(file => file.toLowerCase().includes(query));
            renderGallery(filtered);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }
